services:
  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    env_file: ../apps/api/.env
    ports: ['127.0.0.1:3001:3001']
    restart: unless-stopped
    mem_limit: 512m
  backup:
    build:
      context: ..
      dockerfile: ops/Dockerfile
    env_file: .env
    environment:
      BACKUP_ROOT: /backups
      PGSSLROOTCERT: /run/secrets/db-ca.pem
    volumes:
      - '${BACKUP_HOST_ROOT:?Set a private host backup path}:/backups'
      - '${PG_CA_HOST_PATH:?Set database CA path}:/run/secrets/db-ca.pem:ro'
    restart: unless-stopped
    mem_limit: 768m
  monitor:
    build:
      context: ..
      dockerfile: ops/Dockerfile
    command: ['node', 'scripts/ops/monitor.js']
    env_file: .env
    environment:
      BACKUP_ROOT: /backups
      MONITOR_API_URL: http://api:3001/api/health/database
    volumes: ['${BACKUP_HOST_ROOT:?Set a private host backup path}:/backups:ro']
    restart: unless-stopped
    mem_limit: 256m
