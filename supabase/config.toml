# This is a local project name, not the reference of a hosted Supabase project.
project_id = "financial-management"

# Preview data is generated by React, never seeded into the remote database.
[db.seed]
enabled = false

# Bucket declarations are deployed by the GitHub integration. Object policies
# must still be applied from supabase/storage/ after the application migrations.
[storage.buckets.cash-flow-receipts]
public = false
file_size_limit = "5MiB"
allowed_mime_types = ["image/jpeg", "image/png", "application/pdf"]

[storage.buckets.cash-flow-exports]
public = false
file_size_limit = "2MiB"
allowed_mime_types = ["text/csv"]
